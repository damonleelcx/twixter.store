# Ingress 暴露前端，与 backend 共用 nginx ingress
# 生产：host 用 www.twixter.store。本地 Minikube：要么在 hosts 里写 <MINIKUBE_IP> www.twixter.store，要么改为 www.twixter.local 并与 README 的 hosts 一致
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twixter-frontend-ingress
  namespace: default
  labels:
    app: twixter-frontend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100gb"
    # cert-manager 自动签发证书（需先安装 cert-manager 并创建 ClusterIssuer letsencrypt-prod）
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: www.twixter.store
      http:
        paths:
          # /api 直接到后端，避免 Next.js 构建时 rewrites 写死导致 504
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: twixter-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twixter-frontend
                port:
                  number: 3000
  # TLS：cert-manager 会根据下方 secretName 自动创建/续期证书；若不用 cert-manager，可手动 kubectl create secret tls twixter-frontend-tls ...
  tls:
    - hosts:
        - www.twixter.store
      secretName: twixter-frontend-tls
