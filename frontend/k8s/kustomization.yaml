# 在仓库根目录：kubectl apply -k k8s/ 会包含本目录
# Secret 从 frontend/k8s/.env 生成（可从 frontend/.env 复制；.env 不要提交到 Git）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

secretGenerator:
  - name: twixter-frontend-secret
    namespace: default
    envs:
      - .env
    type: Opaque
    options:
      disableNameSuffixHash: true
