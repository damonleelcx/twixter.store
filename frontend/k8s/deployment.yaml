# Frontend (Next.js standalone) 部署
# 镜像需在构建时传入 NEXT_PUBLIC_* 等 build args；运行时通过 ConfigMap/Secret 注入 BACKEND_URL 等
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twixter-frontend
  namespace: default
  labels:
    app: twixter-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twixter-frontend
  template:
    metadata:
      labels:
        app: twixter-frontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          # Docker Hub: damonleelcx/twixter.store-frontend:latest ；构建时需传入 NEXT_PUBLIC_* 等 ARG
          image: damonleelcx/twixter.store-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          # ConfigMap 放最后，使 BACKEND_URL 等由 ConfigMap 决定；若 Secret 里误带了 BACKEND_URL=localhost 也不会覆盖
          envFrom:
            - secretRef:
                name: twixter-frontend-secret
            - configMapRef:
                name: twixter-frontend-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # 用 tcpSocket 避免 / 触发 SSR 导致探针超时、Pod 一直 0/1
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
