# cert-manager ClusterIssuer：为 Ingress 自动签发 Let's Encrypt 证书（HTTPS）
# 前置：在 k3s 上安装 cert-manager 和 nginx ingress，且域名 www/api.twixter.store 已解析到集群入口
# 使用前：将 YOUR_EMAIL 替换为你的邮箱（Let's Encrypt 用于到期通知）
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: twixter.store@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
