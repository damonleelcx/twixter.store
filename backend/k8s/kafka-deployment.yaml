# Kafka 单实例，依赖 Zookeeper；与 docker-compose 一致，供后端视频处理
# 若出现 InconsistentClusterIdException（ZK 重建或 clusterId 不一致），删 Pod 让 Deployment 起新 Pod 即可清空 emptyDir 中的 meta.properties
# 不希望 Kafka 被关掉：SIGTERM 由 K8s 在删除/驱逐 Pod 时发送。已配 kafka-pdb（minAvailable:1）以阻止自愿驱逐；
# 请勿对该 Pod 执行 kubectl delete pod / drain 节点；生产建议用托管 Kafka。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: default
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # 给 Kafka 时间优雅退出，避免被强杀
      terminationGracePeriodSeconds: 90
      # 先等 Zookeeper 可连再启动 Kafka，避免 connection refused
      initContainers:
        - name: wait-zookeeper
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z zookeeper 2181; do echo waiting for zookeeper; sleep 2; done; echo zookeeper ready"]
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 9093
              name: kafka-local
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
            # Zookeeper 模式下 Confluent 镜像通常需要显式 broker id，否则可能启动即退出
            - name: KAFKA_BROKER_ID
              value: "1"
            # 覆盖镜像默认的弃用变量，否则 configure 会打印 "port is deprecated" 并 exit 1
            - name: KAFKA_PORT
              value: ""
            - name: KAFKA_HOST
              value: ""
            - name: KAFKA_ADVERTISED_PORT
              value: ""
            - name: KAFKA_ADVERTISED_HOST
              value: ""
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            # 双 listener：PLAINTEXT 供集群内其他 Pod（kafka:9092）；PLAINTEXT_LOCAL 供本进程 Controller 连 localhost，避免 Pod 访问自身 Service 的 hairpin 失败
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_LOCAL://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092,PLAINTEXT_LOCAL://localhost:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_LOCAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT_LOCAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 20
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
      volumes:
        - name: kafka-data
          emptyDir: {}
