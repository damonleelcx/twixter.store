# Backend ClusterIP Service，供 Ingress 与集群内访问
apiVersion: v1
kind: Service
metadata:
  name: twixter-backend
  namespace: default
  labels:
    app: twixter-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: twixter-backend
