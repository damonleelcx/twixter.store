# Ingress 暴露 Backend API，配合 minikube ingress addon 使用
# 启用：minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twixter-backend-ingress
  namespace: default
  labels:
    app: twixter-backend
  annotations:
    # minikube 使用 nginx ingress
    nginx.ingress.kubernetes.io/proxy-body-size: "100gb"
    # cert-manager 自动签发证书（需先安装 cert-manager 并创建 ClusterIssuer letsencrypt-prod）
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # 本地访问：将 api.twixter.local 解析到 minikube IP（或加 hosts 条目）
    - host: api.twixter.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twixter-backend
                port:
                  number: 8080
  # TLS：cert-manager 会根据下方 secretName 自动创建/续期证书；若不用 cert-manager，可手动 kubectl create secret tls twixter-backend-tls ...
  tls:
    - hosts:
        - api.twixter.store
      secretName: twixter-backend-tls
