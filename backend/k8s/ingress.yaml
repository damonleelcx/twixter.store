# Ingress 暴露 Backend API，配合 minikube ingress addon 使用
# 启用：minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twixter-backend-ingress
  namespace: default
  labels:
    app: twixter-backend
  annotations:
    # minikube 使用 nginx ingress
    nginx.ingress.kubernetes.io/proxy-body-size: "100gb"
    # SSE 流式聊天：禁止缓冲，否则 /api/chat/stream 会卡住
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager 自动签发证书（需先安装 cert-manager 并创建 ClusterIssuer letsencrypt-prod）
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    # 生产：host 用 api.twixter.store。本地 Minikube：要么在 hosts 里写 <MINIKUBE_IP> api.twixter.store，要么改为 api.twixter.local 并与 README 的 hosts 一致
    - host: api.twixter.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twixter-backend
                port:
                  number: 8080
  # TLS：cert-manager 会根据下方 secretName 自动创建/续期证书；若不用 cert-manager，可手动 kubectl create secret tls twixter-backend-tls ...
  tls:
    - hosts:
        - api.twixter.store
      secretName: twixter-backend-tls
