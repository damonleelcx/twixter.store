# Ingress 暴露 Backend API，配合 minikube ingress addon 使用
# 启用：minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twixter-backend-ingress
  namespace: default
  labels:
    app: twixter-backend
  annotations:
    # minikube 使用 nginx ingress
    nginx.ingress.kubernetes.io/proxy-body-size: "100gb"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    # 本地访问：将 api.twixter.local 解析到 minikube IP（或加 hosts 条目）
    - host: api.twixter.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twixter-backend
                port:
                  number: 8080
  # 若需 TLS，取消注释并创建 tls secret
  # tls:
  #   - hosts:
  #       - api.twixter.local
  #     secretName: twixter-backend-tls
