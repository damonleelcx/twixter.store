# 可选：使用 kubectl apply -k k8s/ 一次性应用
# Secret 可从 .env 生成：在 backend 目录执行 kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  # - secret.yaml   # 使用 secretGenerator 从 .env 生成时注释掉
  - zookeeper-deployment.yaml
  - zookeeper-service.yaml
  - kafka-deployment.yaml
  - kafka-service.yaml
  - kafka-pdb.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - redis-pdb.yaml
  - mongodb-statefulset.yaml
  - mongodb-service.yaml
  # 使用外部 LLM（如 vast.ai / OpenRouter）时不部署集群内 LLM；需要时取消注释
  # - llm-deployment.yaml
  # - llm-service.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# 从 backend/k8s 下的 .env 生成 Secret（便于从根目录 kubectl apply -k k8s/ 时通过路径校验）
# 部署前请将 backend/.env 复制为 backend/k8s/.env，或直接在 backend/k8s/.env 配置
secretGenerator:
  - name: twixter-backend-secret
    namespace: default
    envs:
      - .env
    type: Opaque
    options:
      disableNameSuffixHash: true
