# 可选：使用 kubectl apply -k k8s/ 一次性应用
# Secret 可从 .env 生成：在 backend 目录执行 kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  # - secret.yaml   # 使用 secretGenerator 从 .env 生成时注释掉
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# 从 backend 目录下的 .env 生成 Secret（.env 不要提交到 Git）
secretGenerator:
  - name: twixter-backend-secret
    namespace: default
    envs:
      - ../.env
    type: Opaque
    options:
      disableNameSuffixHash: true
