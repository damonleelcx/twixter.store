# Backend 使用的敏感配置，从托管 Postgres 等获取的凭证请填入此处。
# 部署前请替换所有 placeholder 为实际值（托管数据库、Stripe、AWS 等）。
# 使用托管 Postgres 时：DB_HOST/DB_USER/DB_PASSWORD/DB_NAME 使用云厂商提供的连接信息。
apiVersion: v1
kind: Secret
metadata:
  name: twixter-backend-secret
  namespace: default
  labels:
    app: twixter-backend
type: Opaque
stringData:
  # --- 托管 Postgres（Managed PostgreSQL）凭证 ---
  # 从云厂商（如 AWS RDS、GCP Cloud SQL、Azure Database）提供的连接信息填写
  DB_HOST: "your-managed-postgres-host.example.com"
  DB_USER: "your-db-user"
  DB_PASSWORD: "your-db-password"
  DB_NAME: "twixter"
  DB_PORT: "5432"
  DB_SSLMODE: "require"

  # --- Redis（若集群内无 Redis，改为外部地址）---
  REDIS_ADDR: "redis-service:6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"

  # --- Sentry（可选）---
  SENTRY_DSN: ""

  # --- AWS S3（视频上传）---
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "your-bucket-name"

  # --- Kafka（集群内已提供 kafka Service，见 kafka-deployment.yaml）---
  KAFKA_BROKERS: "kafka:9092"

  # --- Stripe ---
  STRIPE_SECRET_KEY: "sk_test_your-stripe-secret-key"
  STRIPE_WEBHOOK_SECRET: ""

  # --- PayPal（备用支付，可选）---
  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
  PAYPAL_MODE: "sandbox"

  # --- 前端地址（Stripe 回调等）---
  FRONTEND_URL: "http://localhost:3000"

  # --- 种子 Admin（若库中无 admin 则创建；部署时替换为实际值）---
  ADMIN_EMAIL: "xxx"
  ADMIN_PASSWORD: "xxx"
